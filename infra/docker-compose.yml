services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aven-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aven_user
      POSTGRES_PASSWORD: aven_password
      POSTGRES_DB: aven_db
    ports:
      - '5432:5432'
    volumes:
      - aven_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aven_user -d aven_db']
      interval: 5s
      timeout: 5s
      retries: 5

  # One-container local S3 store. Sample credentials are for synthetic data only.
  seaweedfs:
    image: chrislusf/seaweedfs
    container_name: aven-objects
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: aven-documents
    ports:
      - '127.0.0.1:9000:8333'
    volumes:
      - aven_objects_data:/data

volumes:
  aven_postgres_data:
    name: aven_postgres_data
  aven_objects_data:
    name: aven_objects_data
