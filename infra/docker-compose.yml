services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aven-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aven_user
      POSTGRES_PASSWORD: aven_password
      POSTGRES_DB: aven_db
    ports:
      - "5432:5432"
    volumes:
      - aven_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aven_user -d aven_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: aven-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aven_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: aven-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/aven-documents;
      exit 0;
      "

volumes:
  aven_postgres_data:
    name: aven_postgres_data
  aven_minio_data:
    name: aven_minio_data
